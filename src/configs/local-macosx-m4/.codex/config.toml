personality = "pragmatic"
model = "gpt-5.4"

[projects."/Users/sthinds"]
trust_level = "trusted"

[projects."/Users/sthinds/Coding/Projects/Personal/workflow-macm4"]
trust_level = "trusted"

[projects."/Users/sthinds/Coding/Research/joplin-mcp-server"]
trust_level = "trusted"

[projects."/usr/local/src/joplin_mcp"]
trust_level = "trusted"

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[mcp_servers.joplin]
command = "/opt/homebrew/bin/uv"
args = ["--directory", "/usr/local/src/joplin_mcp", "run", "src/mcp/joplin_mcp.py"]

[mcp_servers.trello]
command = "bash"
args = ["-lc", 'source ~/.config/.env.TRELLO_API_KEY && source ~/.config/.env.TRELLO_API_TOKEN && export TRELLO_TOKEN="$TRELLO_API_TOKEN" && exec npx -y @delorenj/mcp-server-trello']

[mcp_servers.home-assistant]
url = "http://192.168.1.243:8086/mcp-secret"
enabled = true

[tui.model_availability_nux]
"gpt-5.3-codex-spark" = 4

# Daybook worklog Stop hook — mirrors the Claude Code daybook reminder.
# Blocks the turn once to nag for a Joplin daybook entry after non-trivial work;
# the "reason" becomes a continuation prompt. Defined in config.toml (not
# hooks.json) so it coexists with OpenIsland's ~/.codex/hooks.json instead of
# clobbering it. Scoped to this layer because the Joplin MCP server lives here.
# Requires a one-time trust approval via `/hooks` in Codex after install.
[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "$HOME/.codex/hooks/daybook-reminder.sh"
timeout = 10
